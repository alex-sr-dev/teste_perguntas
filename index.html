<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado</title>
<style>
:root{--primary:#2c3e50;--accent:#3498db;--success:#27ae60;--danger:#c0392b;--light:#ecf0f1}*{box-sizing:border-box}body{font-family:'Segoe UI',Arial,sans-serif;background:var(--light);margin:0;padding:18px}.container{max-width:850px;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 4px 15px #0002}.container.amplo{max-width:1050px}.hidden{display:none!important}button{border:0;border-radius:7px;padding:12px 17px;cursor:pointer;font-weight:700}button:disabled{opacity:.5;cursor:not-allowed}.btn{background:var(--primary);color:white}.btn-ok{background:var(--success);color:white}.btn-erro{background:#e67e22;color:white}.btn-voltar{background:#95a5a6;color:white}.materia{background:var(--primary);color:white;padding:18px;border-radius:9px;margin:10px 0;cursor:pointer}.materia:hover{background:#1a252f}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.modo{border:2px solid #dfe6e9;background:white;text-align:left;padding:20px;border-radius:10px}.modo:hover{border-color:var(--accent);background:#f5fbff}.modo h3{margin:0 0 8px}.modo p{margin:0;color:#666}.ordem{background:#f8fafc;border:1px solid #dfe6e9;border-radius:9px;padding:16px;margin:20px 0}.ordem label{display:block;padding:7px 0;cursor:pointer}.ordem input{accent-color:var(--accent)}.topo,.controles,.acoes{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:15px 0}.progresso{height:10px;background:#eee;border-radius:8px;overflow:hidden}.barra{height:100%;background:var(--accent);width:0%;transition:.2s}.questao{border:1px solid #dfe6e9;border-radius:10px;padding:20px;margin:20px 0}.questao.certa{border-left:6px solid var(--success)}.questao.errada{border-left:6px solid var(--danger)}.questao.anulada{border-left:6px solid #e67e22}.meta{color:#666;font-size:.9em;margin:10px 0}.tag{display:inline-block;background:var(--accent);color:white;padding:4px 8px;border-radius:5px}.opcao{display:flex;gap:10px;align-items:flex-start;padding:12px;border:2px solid #ddd;border-radius:7px;margin:8px 0;cursor:pointer}.opcao.selecionada{border-color:var(--accent);background:#e8f4fd}.opcao.correta{border-color:var(--success);background:#d4edda}.opcao.incorreta{border-color:var(--danger);background:#f8d7da}.comentario{background:#e8f4fd;border-left:5px solid var(--accent);padding:15px;margin-top:15px;border-radius:5px}.comentario.acerto{background:#d4edda;border-color:var(--success)}.comentario.erro{background:#f8d7da;border-color:var(--danger)}.painel{background:#fff8e8;border:2px solid #f39c12;padding:18px;border-radius:9px;margin-top:20px}.relacionar{display:grid;grid-template-columns:1fr 1fr;gap:15px}.relacionar>div{border:1px solid #ddd;padding:10px;border-radius:7px}.relacionar input{width:75px;padding:8px}.relacionar-item{padding:10px;border-bottom:1px solid #ddd}.relacionar-item.correta{background:#d4edda}.relacionar-item.incorreta{background:#f8d7da}textarea{width:100%;min-height:140px;padding:12px;border:1px solid #ccc;border-radius:7px}.status{font-size:.9em;color:#666}.copia{color:#1e8449;font-weight:600}.copia.erro{color:var(--danger)}@media(max-width:650px){body{padding:7px}.container{padding:15px}.grid,.relacionar{grid-template-columns:1fr}.questao{padding:13px}.controles button{flex:1}}
</style>
</head>
<body><main id="container" class="container">
<section id="menu"><h1>📚 Simulado</h1><p>Selecione uma matéria:</p><div id="materias"></div></section>
<section id="selecao" class="hidden"><button class="btn-voltar" onclick="voltarMenu()">← Voltar</button><h2 id="titulo"></h2><div class="ordem"><h3>Ordem das questões</h3><label><input type="radio" name="ordem" value="sequencial" checked> Sequencial — ordem original do JSON</label><label><input type="radio" name="ordem" value="aleatoria"> Aleatória — embaralhar a cada início</label></div><div class="grid"><button class="modo" onclick="iniciar('uma')"><h3>1️⃣ Uma por uma</h3><p>Responder uma questão de cada vez.</p></button><button class="modo" onclick="iniciar('todas')"><h3>📋 Todas as questões</h3><p>Mostrar todas na mesma página.</p></button></div><div id="painel-erros" class="painel hidden"><h3>🎯 Questões erradas salvas</h3><p id="total-erros"></p><div class="acoes"><button class="btn-erro" onclick="iniciar('uma',true)">Refazer uma por uma</button><button class="btn-erro" onclick="iniciar('todas',true)">Refazer todas</button><button class="btn-voltar" onclick="limparErros()">Limpar lista</button></div></div></section>
<section id="simulado" class="hidden"><div class="topo"><button class="btn-voltar" onclick="voltarSelecao()">← Voltar</button></div><div id="status-copia" class="copia" aria-live="polite"></div><div class="progresso"><div id="barra" class="barra"></div></div><p id="status" class="status"></p><div id="questoes"></div><div id="controles" class="controles"><button class="btn" id="anterior" onclick="navegar(-1)">Anterior</button><button class="btn-ok" id="responder" onclick="corrigir()">Responder</button><button class="btn" id="proxima" onclick="navegar(1)">Próxima →</button></div><div id="controles-todas" class="controles hidden"><span id="resumo"></span><button class="btn" id="finalizar" onclick="finalizar()">Finalizar simulado</button></div></section>
</main><script>
'use strict';
const arquivos={susp:'questoes_susp.json',historia:'questoes_historia.json',mkp:'mkp.json',edo:'questao_edo.json',criminologia:'questao_criminologia.json',da:'questoes_da.json',li:'questoes_li.json',legislacao:'questoes_li.json',legislacao_institucional:'questoes_li.json',daap:'questoes_daap.json'};
const letras='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
let materia=null,questoes=[],originais=[],respostas=[],indice=0,modo='uma',revisao=false,erros=new Set(),encerrado=false;
const el=id=>document.getElementById(id);const escapeHtml=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const tipo=q=>{const t=String(q.tipo||'multipla_escolha').toLowerCase().replaceAll('-','_');return ['vf','verdadeiro/falso','verdadeiro_falso'].includes(t)?'verdadeiro_falso':['relacionar','associar','correlacionar'].includes(t)?'relacionar':['aberta','dissertativa','resposta_curta'].includes(t)?'resposta_curta':'multipla_escolha'};
const anulada=q=>q.anulada===true||q.ativa===false||String(q.status||'').toUpperCase().includes('ANULADA');
const idQuestao=(q,i)=>String(q.id??q.numero_original??`questao-${i}`);
const chave=()=>`simulado_erros_${materia.id}`;
const arquivo=()=>arquivos[materia.id]||`questoes_${materia.id}.json`;
const opcoes=q=>q.opcoes||q.alternativas||[];
function gabarito(q){const c=q.correta??q.resposta;const o=opcoes(q);if(typeof c==='number')return c;const v=String(c??'').trim().toUpperCase();if(/^[A-Z]$/.test(v))return letras.indexOf(v);return o.findIndex(x=>String(x).trim().toUpperCase()===v)}
function gabRelacionar(q){const c=q.correta??q.resposta??[];return(Array.isArray(c)?c:String(c).split(/[,;|\s]+/)).map(x=>Number(String(x).replace(/[^0-9]/g,''))).filter(x=>Number.isFinite(x)&&x>0)}
function embaralhar(lista){const a=[...lista];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function carregarErros(){try{const a=JSON.parse(localStorage.getItem(chave())||'[]');return new Set(Array.isArray(a)?a.map(String):[])}catch{return new Set()}}
function salvarErros(){try{localStorage.setItem(chave(),JSON.stringify([...erros]))}catch(e){console.warn(e)}atualizarErros()}
function atualizarErros(){if(!materia)return;const n=carregarErros().size;el('painel-erros').classList.toggle('hidden',!n);el('total-erros').textContent=`${n} questão(ões) para revisar nesta matéria.`}
function limparErros(){if(!confirm('Apagar a lista de questões erradas?'))return;erros.clear();salvarErros()}
async function carregarMenu(){try{const r=await fetch('materias.json',{cache:'no-store'});if(!r.ok)throw Error('materias.json não encontrado');const ms=await r.json();el('materias').replaceChildren();for(const m of ms){const d=document.createElement('div');d.className='materia';const h=document.createElement('h3');h.textContent=m.materia;d.append(h);d.onclick=()=>selecionarMateria(m.id,m.materia);el('materias').append(d)}}catch(e){el('materias').textContent='Erro: '+e.message}}
function selecionarMateria(id,nome){materia={id,nome};el('titulo').textContent=nome;el('menu').classList.add('hidden');el('selecao').classList.remove('hidden');atualizarErros()}
async function iniciar(modoNovo,apenasErradas=false){if(!materia)return;try{const r=await fetch(arquivo(),{cache:'no-store'});if(!r.ok)throw Error(`Arquivo ${arquivo()} não encontrado`);const conteudo=JSON.parse((await r.text()).replace(/^\uFEFF/,'').trim());originais=Array.isArray(conteudo)?conteudo:conteudo.questoes||[];if(!originais.length)throw Error('Nenhuma questão encontrada');modo=modoNovo;revisao=apenasErradas;indice=0;encerrado=false;const validos=new Set(originais.filter(q=>!anulada(q)).map((q,i)=>idQuestao(q,i)));erros=new Set([...carregarErros()].filter(x=>validos.has(x)));salvarErros();questoes=apenasErradas?originais.filter((q,i)=>!anulada(q)&&erros.has(idQuestao(q,i))):[...originais];if(!questoes.length){alert('Não há questões erradas salvas.');return}if(document.querySelector('input[name="ordem"]:checked')?.value==='aleatoria')questoes=embaralhar(questoes);respostas=questoes.map(q=>({respondida:anulada(q),resposta:null,acertou:false}));el('selecao').classList.add('hidden');el('simulado').classList.remove('hidden');el('container').classList.toggle('amplo',modo==='todas');el('status-copia').textContent='';renderizar();window.scrollTo(0,0)}catch(e){console.error(e);alert('Erro ao carregar questões: '+e.message)}}
const totalAtivas=()=>questoes.filter(q=>!anulada(q)).length;
const respondidas=()=>respostas.filter((r,i)=>r.respondida&&!anulada(questoes[i])).length;
const acertos=()=>respostas.filter((r,i)=>r.acertou&&!anulada(questoes[i])).length;
function numeroAtivo(i){return questoes.slice(0,i+1).filter(q=>!anulada(q)).length}
function comentario(q){return q.resposta_comentada||q.comentario||q.justificativa||q.explicacao||'Sem comentário disponível.'}
function montar(i){const q=questoes[i],r=respostas[i],t=tipo(q),n=anulada(q),o=opcoes(q);let conteudo='';if(t==='relacionar'){const a=q.coluna_a||[],b=q.coluna_b||[],gab=gabRelacionar(q),resp=Array.isArray(r.resposta)?r.resposta:b.map(()=>'');conteudo=`<div class="relacionar"><div><h4>Coluna A</h4>${a.map((x,k)=>`<div class="relacionar-item"><b>${k+1}.</b> ${escapeHtml(x)}</div>`).join('')}</div><div><h4>Coluna B</h4>${b.map((x,k)=>{const certo=Number(resp[k])===gab[k];return `<div class="relacionar-item ${r.respondida?(certo?'correta':'incorreta'):''}"><b>${letras[k]}.</b> ${escapeHtml(x)}<p>Número: <input type="number" min="1" max="${a.length}" value="${escapeHtml(resp[k])}" ${r.respondida?'disabled':''} oninput="salvarRel(${i},${k},this.value)"> ${r.respondida&&!certo?`Correto: ${gab[k]}`:''}</p></div>`}).join('')}</div></div>`}else if(t==='resposta_curta'){conteudo=`<textarea ${r.respondida?'disabled':''} oninput="salvarCurta(${i},this.value)" placeholder="Digite sua resposta">${escapeHtml(r.resposta||'')}</textarea>${r.respondida?`<p><b>Resposta esperada:</b> ${escapeHtml(q.resposta_modelo||q.correta||'Consulte o comentário.')}</p>`:''}`}else{const gab=gabarito(q);conteudo=o.map((x,k)=>`<label class="opcao ${r.respondida?(k===gab?'correta':k===r.resposta?'incorreta':''):k===r.resposta?'selecionada':''}"><input type="radio" name="q-${i}" ${r.resposta===k?'checked':''} ${r.respondida?'disabled':''} onchange="selecionarOpcao(${i},${k})"><b>${letras[k]}</b><span>${escapeHtml(x)}</span></label>`).join('')}const feedback=n?`<div class="comentario"><b>⚠️ Questão anulada — não contabilizada.</b><p>${escapeHtml(comentario(q))}</p></div>`:r.respondida?`<div class="comentario ${r.acertou?'acerto':'erro'}"><b>${r.acertou?'✅ Resposta correta!':'❌ Resposta incorreta.'}</b><p><b>Justificativa:</b> ${escapeHtml(comentario(q))}</p></div>`:'';return `<article class="questao ${n?'anulada':r.respondida?r.acertou?'certa':'errada':''}" id="card-${i}"><b>${n?'Questão anulada':`Questão ${numeroAtivo(i)} de ${totalAtivas()}`}</b><div class="meta"><span class="tag">${escapeHtml(q.topico||q.artigo||'Geral')}</span> · ${escapeHtml(t.replaceAll('_',' '))} · ID: ${escapeHtml(q.id||'--')} · Original: ${escapeHtml(q.numero_original??i+1)}</div><h3>${escapeHtml(q.pergunta||q.enunciado||'')}</h3>${conteudo}${feedback}${modo==='todas'?`<div class="acoes"><button class="btn-ok" ${r.respondida?'disabled':''} onclick="corrigir(${i})">${n?'Anulada':r.respondida?'Respondida':'Responder questão'}</button></div>`:''}</article>`}
function renderizar(){const total=totalAtivas(),feitas=respondidas(),nulas=questoes.length-total;el('barra').style.width=(total?100*feitas/total:100)+'%';el('status').innerHTML=`${revisao?'🎯 Revisão — ':''}${modo==='todas'?'Todas as questões':`Questão ${indice+1} de ${questoes.length}`} — Respondidas: <b>${feitas}/${total}</b> — Acertos: <b>${acertos()}</b> — Anuladas: <b>${nulas}</b>`;el('questoes').innerHTML=modo==='todas'?questoes.map((_,i)=>montar(i)).join(''):montar(indice);el('controles').classList.toggle('hidden',modo==='todas');el('controles-todas').classList.toggle('hidden',modo!=='todas');if(modo==='uma'){el('anterior').disabled=indice===0;el('responder').disabled=respostas[indice].respondida;el('proxima').disabled=!respostas[indice].respondida;el('proxima').textContent=indice===questoes.length-1?'Finalizar':'Próxima →'}else{el('resumo').textContent=`Respondidas: ${feitas} de ${total}`;el('finalizar').disabled=feitas!==total}}
function selecionarOpcao(i,k){if(respostas[i].respondida)return;respostas[i].resposta=k;if(modo==='uma')renderizar();else{const card=el(`card-${i}`);card.querySelectorAll('.opcao').forEach((x,j)=>x.classList.toggle('selecionada',j===k))}}
function salvarRel(i,k,v){if(respostas[i].respondida)return;if(!Array.isArray(respostas[i].resposta))respostas[i].resposta=(questoes[i].coluna_b||[]).map(()=>'');respostas[i].resposta[k]=v}
function salvarCurta(i,v){if(!respostas[i].respondida)respostas[i].resposta=v}
function normalizar(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function avaliarCurta(q,v){const txt=normalizar(v);return(q.respostas_aceitas||[]).some(m=>{const palavras=normalizar(m).split(' ').filter(p=>p.length>3);return palavras.length>0&&palavras.filter(p=>txt.includes(p)).length>=Math.max(2,Math.ceil(palavras.length*.45))})}
function corrigir(i=indice){const q=questoes[i],r=respostas[i],t=tipo(q);if(r.respondida)return;if(t==='relacionar'){const g=gabRelacionar(q);if(!Array.isArray(r.resposta)||r.resposta.length!==g.length||r.resposta.some(x=>String(x).trim()===''))return alert('Preencha todas as correspondências.');r.acertou=r.resposta.every((x,k)=>Number(x)===g[k])}else if(t==='resposta_curta'){if(!String(r.resposta||'').trim())return alert('Digite sua resposta.');r.acertou=avaliarCurta(q,r.resposta)}else{if(r.resposta===null)return alert('Selecione uma alternativa.');r.acertou=r.resposta===gabarito(q)}r.respondida=true;const ident=idQuestao(q,i);if(r.acertou)erros.delete(ident);else erros.add(ident);salvarErros();const y=window.scrollY;renderizar();if(modo==='todas')requestAnimationFrame(()=>window.scrollTo(0,y))}
function navegar(delta){if(delta>0&&!respostas[indice].respondida)return;const proximo=indice+delta;if(proximo>=questoes.length)return finalizar();if(proximo<0)return;indice=proximo;renderizar();window.scrollTo(0,0)}
function finalizar(){if(respondidas()!==totalAtivas())return alert(`Faltam ${totalAtivas()-respondidas()} questões.`);encerrado=true;salvarErros();const total=totalAtivas(),nota=total?Math.round(100*acertos()/total):0;el('questoes').innerHTML=`<div style="text-align:center;padding:25px"><h2>✅ Simulado concluído!</h2><p>Você acertou <b>${acertos()} de ${total}</b> questões ativas.</p><h2>${nota}% de acertos</h2><p>Questões anuladas: ${questoes.length-total}</p><p>Questões erradas salvas: ${erros.size}</p><div class="acoes">${erros.size?'<button class="btn-erro" onclick="iniciar(modo,true)">Refazer somente erradas</button>':''}<button class="btn" onclick="voltarSelecao()">Escolher outro modo</button><button class="btn-voltar" onclick="voltarMenu()">Menu</button></div></div>`;el('barra').style.width='100%';el('controles').classList.add('hidden');el('controles-todas').classList.add('hidden');el('status').textContent=`Resultado: ${nota}%`;window.scrollTo(0,0)}
function voltarSelecao(){el('simulado').classList.add('hidden');el('selecao').classList.remove('hidden');el('container').classList.remove('amplo');atualizarErros();window.scrollTo(0,0)}
function voltarMenu(){el('simulado').classList.add('hidden');el('selecao').classList.add('hidden');el('menu').classList.remove('hidden');el('container').classList.remove('amplo');materia=null;window.scrollTo(0,0)}
async function copiarJson(){try{const r=await fetch(arquivo(),{cache:'no-store'});if(!r.ok)throw Error('Arquivo não encontrado');const json=JSON.stringify(JSON.parse((await r.text()).replace(/^\uFEFF/,'')),null,2);if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(json);else{const t=document.createElement('textarea');t.value=json;document.body.append(t);t.select();if(!document.execCommand('copy'))throw Error('Cópia não permitida');t.remove()}el('status-copia').textContent='✅ JSON copiado!';el('status-copia').classList.remove('erro')}catch(e){el('status-copia').textContent='❌ '+e.message;el('status-copia').classList.add('erro')}}
window.addEventListener('DOMContentLoaded',carregarMenu);
</script></body></html>
